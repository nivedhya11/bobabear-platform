# IMP-038 Tranche A — Nginx is the sole CSP/security-header authority on the
# real serving path (static export makes Next.js headers() a no-op).
#
# CSP_PHASE: REPORT_ONLY (FD-038-05). Flip to Content-Security-Policy after
# report-only proves auth-challenge + Maps/address journeys under the allowlist.
# No script-src wildcards. No nonces (static export). 'unsafe-inline' is required
# for Next.js static bootstrap without per-request nonces (documented residual).
#
# Generated by scripts/generate-nginx-security-headers.mjs — do not hand-edit
# the CSP host inventory without updating that generator.
# GA hosts omitted (GA not enabled). Generate with --ga or GA env to include.

add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' https://checkout.razorpay.com https://challenges.cloudflare.com https://maps.googleapis.com https://maps.gstatic.com; style-src 'self' 'unsafe-inline' https://maps.googleapis.com https://maps.gstatic.com; img-src 'self' data: blob: https://maps.googleapis.com https://maps.gstatic.com; font-src 'self'; connect-src 'self' https://api.razorpay.com https://lumberjack.razorpay.com https://checkout.razorpay.com https://challenges.cloudflare.com https://maps.googleapis.com; frame-src 'self' https://api.razorpay.com https://checkout.razorpay.com https://challenges.cloudflare.com; worker-src 'self' blob:;" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), browsing-topics=(), payment=()" always;
add_header X-Frame-Options "SAMEORIGIN" always;
