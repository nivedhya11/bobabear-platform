# BOBA Bear static application runtime (IMP-005A), plus narrow reverse
# proxies to the dedicated customer-auth (IMP-009), workforce-auth
# (IMP-010), customer-commerce (IMP-024), and operations (IMP-029) services.
#
# Serves the Next.js `output: "export"` bundle (trailingSlash: true, so
# every page route is a directory containing index.html — e.g.
# /privacy/index.html) as plain static files. No TLS termination, no
# database reference: this process never connects to PostgreSQL, and never
# proxies anything except the `/api/customer-auth/`, `/api/workforce-auth/`,
# `/api/v1/`, `/api/operations/v1/`, and Razorpay webhook prefixes below.
#
# `/api/auth/customer/*` and `/api/auth/workforce/*` (Better Auth's own
# internal HTTP surfaces) and auth/commerce/operations `/health/*` endpoints
# are deliberately NOT proxied — only the public façade paths under
# `/api/customer-auth/`, `/api/workforce-auth/`, `/api/v1/`,
# `/api/operations/v1/`, and the exact Razorpay webhook path are reachable
# from outside the Compose network.

worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Read-only root filesystem: every path Nginx writes to at runtime must be
  # an explicit writable tmpfs mount (see compose.yaml `app` service). Set
  # directly to /tmp itself (not a subdirectory) — the tmpfs mount replaces
  # whatever the image baked in at /tmp, and Nginx does not create the base
  # component of a temp path itself, only hashed subdirectories beneath it.
  client_body_temp_path /tmp;
  proxy_temp_path       /tmp;
  fastcgi_temp_path     /tmp;
  uwsgi_temp_path       /tmp;
  scgi_temp_path        /tmp;

  access_log /dev/stdout;
  error_log  /dev/stderr;

  server_tokens off;
  sendfile on;
  keepalive_timeout 65;

  server {
    listen 8080;
    server_name _;
    # Directory normalization must not reveal this container-only listener.
    absolute_redirect off;
    root /usr/share/nginx/html;

    # Runtime DNS resolver fragment written at container start from this
    # container's /etc/resolv.conf (see docker/nginx/40-boba-runtime-resolver.sh).
    # Variable `proxy_pass` targets below resolve lazily at request time so
    # optional upstreams (e.g. customer-auth) need not exist when Nginx starts.
    # Do not hardcode engine-specific resolver addresses.
    include /tmp/boba-nginx-resolver.conf;

    # Narrow reverse proxy to the customer-auth service (IMP-009). Exact
    # public façade path prefix only — never `/api/auth/customer/*` (Better
    # Auth's own internal surface) and never the service's `/health/*`
    # endpoints, both of which stay unreachable from outside the Compose
    # network.
    location ^~ /api/customer-auth/ {
      set $customer_auth_upstream http://customer-auth:8081;
      proxy_pass $customer_auth_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Connection "";
      proxy_read_timeout 15s;
      proxy_connect_timeout 5s;
      proxy_send_timeout 15s;
      client_max_body_size 8k;
      proxy_buffering off;
      access_log off;
      add_header Cache-Control "no-store" always;
    }

    # Narrow reverse proxy to the workforce-auth service (IMP-010). Exact
    # public façade path prefix only — never `/api/auth/workforce/*` (Better
    # Auth's own internal surface) and never the service's `/health/*`
    # endpoints, both of which stay unreachable from outside the Compose
    # network.
    location ^~ /api/workforce-auth/ {
      set $workforce_auth_upstream http://workforce-auth:8082;
      proxy_pass $workforce_auth_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Connection "";
      proxy_read_timeout 15s;
      proxy_connect_timeout 5s;
      proxy_send_timeout 15s;
      client_max_body_size 8k;
      proxy_buffering off;
      access_log off;
      add_header Cache-Control "no-store" always;
    }

    # Exact Razorpay webhook ingress (IMP-026A / D-361). Not `/api/v1/*`,
    # not a customer API, not a generic integrations proxy.
    location = /api/integrations/payments/razorpay/webhook {
      set $customer_commerce_upstream http://customer-commerce:8083;
      proxy_pass $customer_commerce_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Connection "";
      proxy_read_timeout 15s;
      proxy_connect_timeout 5s;
      proxy_send_timeout 15s;
      client_max_body_size 64k;
      proxy_buffering off;
      access_log off;
      add_header Cache-Control "no-store" always;
    }

    # Narrow reverse proxy to the customer-commerce service (IMP-024 / D-359).
    # Public commerce prefix `/api/v1/` only — never auth façades and never
    # the service's `/health/*` endpoints.
    location ^~ /api/v1/ {
      set $customer_commerce_upstream http://customer-commerce:8083;
      proxy_pass $customer_commerce_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Connection "";
      proxy_read_timeout 30s;
      proxy_connect_timeout 5s;
      proxy_send_timeout 30s;
      client_max_body_size 64k;
      proxy_buffering off;
      access_log off;
      add_header Cache-Control "no-store" always;
    }

    # Narrow reverse proxy to the Operations Console API (IMP-029 / D-372).
    # Public workforce-business prefix `/api/operations/v1/` only — never the
    # service's `/health/*` endpoints. Incoming Origin is preserved (not
    # synthesized) so Operations `checkTrustedOrigin` remains authoritative.
    location ^~ /api/operations/v1/ {
      set $operations_upstream http://operations:8084;
      proxy_pass $operations_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Connection "";
      proxy_read_timeout 30s;
      proxy_connect_timeout 5s;
      proxy_send_timeout 30s;
      client_max_body_size 64k;
      proxy_buffering off;
      access_log off;
      add_header Cache-Control "no-store" always;
    }

    # IMP-026B: Razorpay Checkout.js is loaded from
    # https://checkout.razorpay.com/v1/checkout.js. This static export currently
    # has no Content-Security-Policy (Next `headers()` is a no-op for
    # `output: "export"`). Do not add wildcard script-src / frame-src /
    # connect-src. Documented Razorpay origins for a future CSP live in
    # `src/lib/razorpay/types.ts`. Webhook age policy remains
    # GTM_PROVIDER_CONFIRMATION_REQUIRED — no hard five-minute rejection.

    # Exported Next.js routes are directories with an index.html
    # (trailingSlash: true). A bare file match covers static assets and
    # extensionless exported routes (e.g. /opengraph-image); $uri/index.html
    # covers a request made without the trailing slash (e.g. "/privacy").
    # No SPA catch-all: an unmatched path falls through to the 404 handler
    # below instead of silently returning index.html.
    location / {
      try_files $uri $uri.html $uri/ $uri/index.html =404;
    }

    location /_next/ {
      try_files $uri =404;
    }

    location /assets/ {
      try_files $uri =404;
    }

    # Serves the exported 404.html with a real HTTP 404 status, instead of
    # Nginx's own default error page.
    error_page 404 /404.html;
    location = /404.html {
      internal;
    }
  }
}
