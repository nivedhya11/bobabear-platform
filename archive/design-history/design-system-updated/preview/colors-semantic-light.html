<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<title>Colors — Semantic Light</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background: var(--bg-page); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .tile { padding: 12px; border-radius: var(--radius-md); border: 1px solid var(--border-default); background: var(--bg-surface); display: flex; flex-direction: column; gap: 6px; min-height: 86px; }
  .tile .swatch { width: 100%; height: 32px; border-radius: var(--radius-sm); border: 1px solid rgba(0,0,0,0.06); }
  .tile .tok { font-family: var(--font-mono); font-size: 10px; color: var(--text-secondary); line-height: 1.3; word-break: break-all; }
  .tile .hex { font-family: var(--font-mono); font-size: 9px; color: var(--text-tertiary); }
  .head { font-family: var(--font-heading); font-size: 16px; color: var(--text-primary); margin: 0 0 10px; line-height: 1; }
</style>
</head>
<body>
  <h2 class="head">Semantic · Light mode</h2>
  <div class="grid">
    <div class="tile"><div class="swatch" style="background:#FAF3E2"></div><div class="tok">bg/page</div><div class="hex">#FAF3E2</div></div>
    <div class="tile"><div class="swatch" style="background:#FDF8EB"></div><div class="tok">bg/section</div><div class="hex">#FDF8EB</div></div>
    <div class="tile"><div class="swatch" style="background:#FEFCF7"></div><div class="tok">bg/surface</div><div class="hex">#FEFCF7</div></div>
    <div class="tile"><div class="swatch" style="background:#FFFFFF"></div><div class="tok">bg/surface-raised</div><div class="hex">#FFFFFF</div></div>
    <div class="tile"><div class="swatch" style="background:#42281A"></div><div class="tok">text/primary</div><div class="hex">#42281A</div></div>
    <div class="tile"><div class="swatch" style="background:#5F3A24"></div><div class="tok">text/secondary</div><div class="hex">#5F3A24</div></div>
    <div class="tile"><div class="swatch" style="background:#8B5C38"></div><div class="tok">text/tertiary</div><div class="hex">#8B5C38</div></div>
    <div class="tile"><div class="swatch" style="background:#8FBD28"></div><div class="tok">interactive/primary</div><div class="hex">#8FBD28</div></div>
  </div>
</body>
</html>
