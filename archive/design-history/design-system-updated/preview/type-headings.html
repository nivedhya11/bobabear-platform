<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>Type — Headings (Bubblegum Sans)</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 22px 28px; background: var(--bg-page); color: var(--text-primary); }
  .row { display: grid; grid-template-columns: 120px 1fr; gap: 18px; align-items: baseline; margin-bottom: 10px; }
  .meta { font-family: var(--font-mono); font-size: 10px; color: var(--text-tertiary); line-height: 1.2; }
  .h { font-family: var(--font-heading); color: var(--text-primary); line-height: 1.15; }
</style>
</head>
<body>
  <div class="row"><div class="meta">heading/h1<br>56·44·32</div><div class="h" style="font-size:48px;letter-spacing:-0.01em">The drop lands Friday.</div></div>
  <div class="row"><div class="meta">heading/h2<br>40·32·28</div><div class="h" style="font-size:36px;line-height:1.2">Indo-Korean. Iced.</div></div>
  <div class="row"><div class="meta">heading/h3<br>32·26·22</div><div class="h" style="font-size:28px;line-height:1.25">This week on the bar</div></div>
  <div class="row"><div class="meta">heading/h4<br>24·22·20</div><div class="h" style="font-size:22px;line-height:1.3">Pearls and panchphoron</div></div>
  <div class="row"><div class="meta">heading/h5<br>20·19·18</div><div class="h" style="font-size:18px;line-height:1.3">From the lineup</div></div>
</body>
</html>
