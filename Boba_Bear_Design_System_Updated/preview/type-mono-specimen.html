<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>Type — Mono + In-use specimen</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 22px 28px; background: var(--bg-page); color: var(--text-primary); }
  .label { font-family: var(--font-body); text-transform: uppercase; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: var(--firefly-400); margin-bottom: 8px; }
  .code { font-family: var(--font-mono); font-size: 14px; color: var(--text-secondary); background: var(--bg-section); padding: 12px 14px; border-radius: var(--radius-md); border: 1px solid var(--border-default); }
  .sku { font-family: var(--font-mono); font-size: 12px; color: var(--saffron-300); letter-spacing: 0.04em; }
  .hr { height: 1px; background: var(--border-subtle); margin: 16px 0; }
  .specimen { display: grid; gap: 6px; }
  .specimen .h { font-family: var(--font-heading); font-size: 28px; line-height: 1.2; color: var(--text-primary); }
  .specimen .p { font-family: var(--font-body); font-size: 16px; line-height: 1.55; color: var(--text-secondary); }
</style>
</head>
<body>
  <div class="label">code · JetBrains Mono</div>
  <div class="code">--firefly-400: #A8D832;</div>
  <div class="hr"></div>
  <div class="specimen">
    <span class="sku">SKU · BB-MATCHA-005</span>
    <div class="h">Matcha &amp; black-pearl</div>
    <div class="p">Stone-ground matcha, double-brewed black, hand-pulled milk, slow-cooked tapioca pearls. Served iced. No syrups.</div>
  </div>
</body>
</html>
