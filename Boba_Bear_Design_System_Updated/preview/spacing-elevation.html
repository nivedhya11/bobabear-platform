<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>Elevation</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 28px 24px; background: var(--bg-page); color: var(--text-primary); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .cell { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .box { width: 100%; height: 60px; background: var(--bg-surface); border: 1px solid var(--border-default); border-radius: var(--radius-lg); }
  .tok { font-family: var(--font-mono); font-size: 10px; color: var(--text-secondary); text-align: center; line-height: 1.3; }
  .x  { box-shadow: var(--shadow-xs); }
  .s  { box-shadow: var(--shadow-sm); }
  .m  { box-shadow: var(--shadow-md); }
  .l  { box-shadow: var(--shadow-lg); }
  .xl { box-shadow: var(--shadow-xl); }
  .gf { box-shadow: var(--shadow-glow-firefly); border-color: var(--firefly-400); background: var(--firefly-500); }
  .gs { box-shadow: var(--shadow-glow-saffron); border-color: var(--saffron-400); background: var(--saffron-500); }
  .inset { box-shadow: var(--shadow-inset-md); background: var(--bg-surface-sunken); }
</style>
</head>
<body>
  <div class="grid">
    <div class="cell"><div class="box x"></div><div class="tok">shadow/xs</div></div>
    <div class="cell"><div class="box s"></div><div class="tok">shadow/sm</div></div>
    <div class="cell"><div class="box m"></div><div class="tok">shadow/md · card hover</div></div>
    <div class="cell"><div class="box l"></div><div class="tok">shadow/lg · popover</div></div>
    <div class="cell"><div class="box xl"></div><div class="tok">shadow/xl · modal</div></div>
    <div class="cell"><div class="box gf"></div><div class="tok">glow-firefly · primary hover</div></div>
    <div class="cell"><div class="box gs"></div><div class="tok">glow-saffron · accent hover</div></div>
    <div class="cell"><div class="box inset"></div><div class="tok">inset · sunken well</div></div>
  </div>
</body>
</html>
