<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>Radii</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--bg-page); color: var(--text-primary); }
  .grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 12px; }
  .cell { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .box { width: 72px; height: 72px; background: var(--firefly-400); border: 2px solid var(--firefly-300); }
  .tok { font-family: var(--font-mono); font-size: 10px; color: var(--text-secondary); text-align: center; line-height: 1.3; }
  .px { font-family: var(--font-mono); font-size: 9px; color: var(--text-tertiary); }
</style>
</head>
<body>
  <div class="grid">
    <div class="cell"><div class="box" style="border-radius:0"></div><div class="tok">none</div><div class="px">0</div></div>
    <div class="cell"><div class="box" style="border-radius:2px"></div><div class="tok">xs</div><div class="px">2 px</div></div>
    <div class="cell"><div class="box" style="border-radius:4px"></div><div class="tok">sm</div><div class="px">4 px</div></div>
    <div class="cell"><div class="box" style="border-radius:8px"></div><div class="tok">md · buttons</div><div class="px">8 px</div></div>
    <div class="cell"><div class="box" style="border-radius:12px"></div><div class="tok">lg · cards</div><div class="px">12 px</div></div>
    <div class="cell"><div class="box" style="border-radius:16px"></div><div class="tok">xl · modals</div><div class="px">16 px</div></div>
    <div class="cell"><div class="box" style="border-radius:24px"></div><div class="tok">2xl · spotlight</div><div class="px">24 px</div></div>
    <div class="cell"><div class="box" style="border-radius:9999px"></div><div class="tok">full · pills</div><div class="px">9999</div></div>
  </div>
</body>
</html>
