<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>Type — Display (Luckiest Guy)</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px 28px; background: var(--bg-page); color: var(--text-primary); }
  .meta { font-family: var(--font-mono); font-size: 10px; color: var(--text-tertiary); margin-bottom: 4px; }
  .line { font-family: var(--font-display); line-height: 1.05; letter-spacing: -0.02em; text-transform: uppercase; color: var(--text-primary); margin-bottom: 14px; }
  .l-2xl { font-size: 64px; }
  .l-xl { font-size: 48px; }
  .l-lg { font-size: 36px; color: var(--saffron-400); text-shadow: 0 0 28px rgba(245, 166, 35, 0.45); }
</style>
</head>
<body>
  <div class="meta">display/2xl · Luckiest Guy 400 · 96/72/56 · LH 1.05 · tracking -0.02em</div>
  <div class="line l-2xl">FOR THE UNBOTHERED.</div>
  <div class="meta">display/xl · 80/60/44</div>
  <div class="line l-xl">CATCH THE DROP.</div>
  <div class="meta">display/lg · 64/48/36 · same-colour glow is the optional campaign treatment</div>

</html>
