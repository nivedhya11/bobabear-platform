# IMP-038 lab fixture — minimal Nginx server illustrating AOP reject-without-client-cert.
# Not used as the Compose app nginx.conf. Lab / documentation only.
# PRODUCTION_REALIZATION_PENDING — owner IMP-039.

worker_processes 1;
error_log /dev/stderr;
pid /tmp/nginx-aop-lab.pid;

events { worker_connections 64; }

http {
  server {
    listen 8443 ssl;
    server_name _;

    # Placeholder paths — IMP-039 installs real material.
    ssl_certificate     /etc/nginx/certs/origin.crt;
    ssl_certificate_key /etc/nginx/certs/origin.key;

    # Contract: require Cloudflare Authenticated Origin Pull client cert.
    ssl_verify_client on;
    ssl_client_certificate /etc/nginx/certs/cloudflare-aop-origin-ca.pem;

    location / {
      return 200 "aop-lab-ok\n";
      add_header Content-Type text/plain;
    }
  }
}
