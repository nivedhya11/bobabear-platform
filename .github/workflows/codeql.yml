# IMP-038 §15 SAST — CodeQL (OSS via GitHub).
# Does not claim compliance certification.
#
# Action pin map (immutable commit SHAs; IMP-038 §15):
#   actions/checkout@v7.0.1       -> 3d3c42e5aac5ba805825da76410c181273ba90b1
#   github/codeql-action@v3.28.19 -> fca7ace96b7d713c7035871441bd52efbe39e27e
name: CodeQL

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: javascript-typescript

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@fca7ace96b7d713c7035871441bd52efbe39e27e # v3.28.19
        with:
          category: "/language:javascript-typescript"
