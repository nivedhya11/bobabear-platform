# Session 3B2 deterministic verification CI for BOBA Bear Platform.
# Verification only: does not deploy, release, or mutate product lifecycle state.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Project consistency
        run: npm run project:consistency
      - name: Governance fingerprint
        run: npm run governance:fingerprint
      - name: Environment hygiene
        run: npm run env:hygiene
      - name: Generate testing inventory diagnostic
        run: node scripts/testing-inventory.mjs --write
      - name: Upload generated testing inventory
        uses: actions/upload-artifact@v4
        with:
          name: session-3b2-testing-inventory
          path: docs/platform/testing/test-inventory.json
          retention-days: 1
      - name: Restore tracked testing inventory
        run: git checkout -- docs/platform/testing/test-inventory.json
      - name: Testing inventory
        run: npm run testing:inventory:check

  unit-component:
    name: Unit / Component
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit and component suite
        run: npm run test

  scripts:
    name: Scripts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Project-consistency regression test
        run: node --test scripts/project-consistency.test.mjs
      - name: Nginx origin-redirect regression test
        run: node --test scripts/nginx-origin-redirect.test.mjs
      - name: Script test suite
        run: npm run test:scripts

  commerce-core:
    name: Commerce Core
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: IMP-028C modifier / bootstrap tests
        run: npm run test:catalog-imp028c-modifiers
      - name: Catalog tests
        run: npm run test:catalog
      - name: Cart tests
        run: npm run test:cart
      - name: Customer-commerce HTTP tests
        run: npm run test:customer-commerce:http
      - name: Customer Menu projection unit tests
        run: node scripts/run-vitest.mjs run src/server/customer-commerce/menu/project-customer-menu.test.ts
      - name: Customer Menu modifier projection integration tests
        run: >-
          node scripts/run-vitest.mjs run
          --config vitest.database.config.mts
          tests/database/customer-menu-modifier-projection.integration.test.ts

  security-smoke:
    name: Security Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Access-control tests
        run: npm run test:access-control
      - name: Checkout security tests
        run: npm run test:checkout-security

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://thebobabear.in

  database-foundation:
    name: Database Foundation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Persistence database tests
        run: npm run test:database:persistence
      - name: Outbox / idempotency database tests
        run: npm run test:database:outbox-idempotency
      - name: Auth foundation database tests
        run: npm run test:database:auth-foundation

  database-commerce:
    name: Database Commerce
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Cart database tests
        run: npm run test:database:cart
      - name: Checkout database tests
        run: npm run test:database:checkout
      - name: Payment database tests
        run: npm run test:database:payment
      - name: Order database tests
        run: npm run test:database:order
      - name: Serviceability database tests
        run: npm run test:database:serviceability
      - name: Catalog database tests
        run: npm run test:database:catalog

  security-matrix:
    name: Security Matrix
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Access-control tests
        run: npm run test:access-control
      - name: Database access-control tests
        run: npm run test:database:access-control
      - name: Payment security tests
        run: npm run test:payment-security
      - name: Checkout security tests
        run: npm run test:checkout-security
      - name: Serviceability security tests
        run: npm run test:serviceability-security

  domain-extended:
    name: Domain Extended
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Checkout tests
        run: npm run test:checkout
      - name: Payment tests
        run: npm run test:payment
      - name: Order tests
        run: npm run test:order
      - name: Serviceability tests
        run: npm run test:serviceability
      - name: Assortment availability tests
        run: npm run test:assortment-availability
      - name: Pricing tax tests
        run: npm run test:pricing-tax
      - name: Promotions tests
        run: npm run test:promotions

  http-surfaces:
    name: HTTP Surfaces
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Customer-auth HTTP tests
        run: npm run test:customer-auth:http
      - name: Workforce-auth HTTP tests
        run: npm run test:workforce-auth:http
      - name: Administration tests
        run: npm run test:administration

  audits:
    name: Audits
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Persistence audit
        run: npm run audit:persistence
      - name: Customer phone auth audit
        run: npm run audit:customer-phone-auth

  # TEMP_SESSION_3B2_INVENTORY_SYNC_BEGIN
  inventory-sync:
    name: Session 3B2 Inventory Sync
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 129 && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
      - name: Finalize workflow and inventory
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('.github/workflows/ci.yml')
          text = path.read_text()
          pattern = re.compile(
              r'      - name: Generate testing inventory diagnostic\n.*?(?=      - name: Testing inventory\n)',
              re.S,
          )
          text, replacements = pattern.subn('', text, count=1)
          if replacements != 1:
              raise SystemExit(f'expected one inventory diagnostic block, removed {replacements}')
          marker = '  # TEMP_SESSION_3B2_INVENTORY_SYNC_BEGIN\n'
          if marker not in text:
              raise SystemExit('expected temporary inventory-sync marker not found')
          text = text.split(marker, 1)[0].rstrip() + '\n'
          path.write_text(text)
          PY
          node scripts/testing-inventory.mjs --write
          node scripts/testing-inventory.mjs --check
      - name: Commit synchronized inventory
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml docs/platform/testing/test-inventory.json
          git diff --cached --exit-code && exit 0
          git commit -m "test: synchronize Session 3B2 inventory"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
