# TEST-1 verification CI for BOBA Bear Platform (Session 3B2).
# Does not deploy, release, or mutate product lifecycle state.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Project consistency
        run: npm run project:consistency

      - name: Governance fingerprint
        run: npm run governance:fingerprint

      - name: Env hygiene
        run: npm run env:hygiene

      - name: Testing inventory check
        run: npm run testing:inventory:check

  unit-component:
    name: Unit / component
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit / component tests
        run: npm run test

  scripts:
    name: Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Script tests
        run: npm run test:scripts

  commerce-core:
    name: Commerce core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure rootless Podman socket
        run: |
          socket="/run/user/$(id -u)/podman/podman.sock"
          command -v podman
          if [ ! -S "$socket" ]; then
            systemctl --user start podman.socket
          fi
          test -S "$socket"
          podman --version

      - name: IMP-028C modifier / bootstrap tests
        run: npm run test:catalog-imp028c-modifiers

      - name: Catalog tests
        run: npm run test:catalog

      - name: Cart tests
        run: npm run test:cart

      - name: Customer-commerce HTTP tests
        run: npm run test:customer-commerce:http

      - name: Customer Menu projection unit tests
        run: node scripts/run-vitest.mjs run src/server/customer-commerce/menu/project-customer-menu.test.ts

      - name: Customer Menu modifier projection integration tests
        run: >-
          node scripts/run-vitest.mjs run
          --config vitest.database.config.mts
          tests/database/customer-menu-modifier-projection.integration.test.ts

  security-smoke:
    name: Security smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure rootless Podman socket
        run: |
          socket="/run/user/$(id -u)/podman/podman.sock"
          command -v podman
          if [ ! -S "$socket" ]; then
            systemctl --user start podman.socket
          fi
          test -S "$socket"
          podman --version

      - name: Access-control tests
        run: npm run test:access-control

      - name: Checkout-security tests
        run: npm run test:checkout-security

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://thebobabear.in

  database-foundation:
    name: Database foundation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure rootless Podman socket
        run: |
          socket="/run/user/$(id -u)/podman/podman.sock"
          command -v podman
          if [ ! -S "$socket" ]; then
            systemctl --user start podman.socket
          fi
          test -S "$socket"
          podman --version

      - name: Database persistence tests
        run: npm run test:database:persistence

      - name: Database outbox / idempotency tests
        run: npm run test:database:outbox-idempotency

      - name: Database auth-foundation tests
        run: npm run test:database:auth-foundation

  database-commerce:
    name: Database commerce
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure rootless Podman socket
        run: |
          socket="/run/user/$(id -u)/podman/podman.sock"
          command -v podman
          if [ ! -S "$socket" ]; then
            systemctl --user start podman.socket
          fi
          test -S "$socket"
          podman --version

      - name: Database cart tests
        run: npm run test:database:cart

      - name: Database checkout tests
        run: npm run test:database:checkout

      - name: Database payment tests
        run: npm run test:database:payment

      - name: Database order tests
        run: npm run test:database:order

      - name: Database serviceability tests
        run: npm run test:database:serviceability

      - name: Database catalog tests
        run: npm run test:database:catalog

  security-matrix:
    name: Security matrix
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure rootless Podman socket
        run: |
          socket="/run/user/$(id -u)/podman/podman.sock"
          command -v podman
          if [ ! -S "$socket" ]; then
            systemctl --user start podman.socket
          fi
          test -S "$socket"
          podman --version

      - name: Access-control tests
        run: npm run test:access-control

      - name: Database access-control tests
        run: npm run test:database:access-control

      - name: Payment-security tests
        run: npm run test:payment-security

      - name: Checkout-security tests
        run: npm run test:checkout-security

      - name: Serviceability-security tests
        run: npm run test:serviceability-security

  domain-extended:
    name: Domain extended
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure rootless Podman socket
        run: |
          socket="/run/user/$(id -u)/podman/podman.sock"
          command -v podman
          if [ ! -S "$socket" ]; then
            systemctl --user start podman.socket
          fi
          test -S "$socket"
          podman --version

      - name: Checkout tests
        run: npm run test:checkout

      - name: Payment tests
        run: npm run test:payment

      - name: Order tests
        run: npm run test:order

      - name: Serviceability tests
        run: npm run test:serviceability

      - name: Assortment / availability tests
        run: npm run test:assortment-availability

      - name: Pricing / tax tests
        run: npm run test:pricing-tax

      - name: Promotions tests
        run: npm run test:promotions

  # IMP-038: security-sensitive PRs must not merge with Admin/Ops/Auth HTTP suites skipped.
  detect-security-sensitive:
    name: Detect security-sensitive paths
    runs-on: ubuntu-latest
    outputs:
      security_sensitive: ${{ steps.detect.outputs.security_sensitive }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect security-sensitive path changes
        id: detect
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "security_sensitive=true" >> "$GITHUB_OUTPUT"
            echo "security_sensitive=true (exact-main always runs HTTP surfaces)"
            exit 0
          fi
          node scripts/ci-security-sensitive-paths.mjs

  http-surfaces:
    name: HTTP surfaces
    # Exact-main always; PRs when Admin/Ops/Auth/security surfaces change.
    if: needs.detect-security-sensitive.outputs.security_sensitive == 'true'
    needs:
      - detect-security-sensitive
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure rootless Podman socket
        run: |
          socket="/run/user/$(id -u)/podman/podman.sock"
          command -v podman
          if [ ! -S "$socket" ]; then
            systemctl --user start podman.socket
          fi
          test -S "$socket"
          podman --version

      - name: Customer-auth HTTP tests
        run: npm run test:customer-auth:http

      - name: Workforce-auth HTTP tests
        run: npm run test:workforce-auth:http

      - name: Administration tests
        run: npm run test:administration

      - name: Operations HTTP tests
        run: npm run test:operations:http

  # Fail-closed gate: sensitive PR cannot be green if HTTP surfaces were skipped or failed.
  security-http-gate:
    name: Security HTTP gate
    if: always() && github.event_name == 'pull_request'
    needs:
      - detect-security-sensitive
      - http-surfaces
    runs-on: ubuntu-latest
    steps:
      - name: Enforce SECURITY_SENSITIVE_PR_CANNOT_MERGE_WITH_RELEVANT_HTTP_INTEGRATION_SUITE_SKIPPED
        env:
          SENSITIVE: ${{ needs.detect-security-sensitive.outputs.security_sensitive }}
          HTTP_RESULT: ${{ needs.http-surfaces.result }}
        run: |
          set -euo pipefail
          echo "security_sensitive=${SENSITIVE}"
          echo "http_surfaces_result=${HTTP_RESULT}"
          if [ "${SENSITIVE}" = "true" ]; then
            if [ "${HTTP_RESULT}" != "success" ]; then
              echo "::error::Security-sensitive PR requires http-surfaces success (got ${HTTP_RESULT})."
              exit 1
            fi
          fi
          echo "Security HTTP gate passed."

  audits:
    name: Audits
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Persistence audit
        run: npm run audit:persistence

      - name: Customer phone-auth audit
        run: npm run audit:customer-phone-auth
