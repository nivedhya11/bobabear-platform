          command -v podman
          if [ ! -S "$socket" ]; then
            systemctl --user start podman.socket
          fi
          test -S "$socket"
          podman --version

      - name: Ensure podman-compose
        run: |
          if ! command -v podman-compose >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y podman-compose
          fi
          podman-compose --version

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Operations lifecycle E2E
        run: npm run test:e2e:operations-lifecycle

      - name: Upload operations-lifecycle evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: nightly-e2e-operations-lifecycle
          path: test-results-operations-lifecycle/**
          if-no-files-found: ignore

