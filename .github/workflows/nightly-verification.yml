# TEST-1 nightly / on-demand expensive verification (Session 3B2).
# Verification only — does not deploy, release, tag, or promote environments.
# Action pin map (immutable commit SHAs; IMP-038 §15):
#   actions/checkout@v7.0.1             -> 3d3c42e5aac5ba805825da76410c181273ba90b1
#   actions/setup-node@v7.0.0           -> 820762786026740c76f36085b0efc47a31fe5020
#   actions/upload-artifact@v7.0.1      -> 043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
#   aquasecurity/trivy-action@v0.30.0   -> 6c175e9c4083a92bbca2f9724c8a5e33bc2d97a5
#   github/codeql-action@v3.28.19       -> fca7ace96b7d713c7035871441bd52efbe39e27e
#   peaceiris/actions-gh-pages@v4.1.0   -> 84c30a85c19949d7eee79c4ff27748b70285e453
name: Nightly Verification

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  e2e-customer-ordering:
    name: E2E customer ordering
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22.23.1"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure rootless Podman socket
        run: |
          socket="/run/user/$(id -u)/podman/podman.sock"
          command -v podman
          if [ ! -S "$socket" ]; then
            systemctl --user start podman.socket
          fi
          test -S "$socket"
          podman --version

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Customer ordering E2E
        run: npm run test:e2e:customer-ordering

      - name: Upload customer-ordering evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: nightly-e2e-customer-ordering
          path: test-results-customer-ordering/**
          if-no-files-found: ignore

  e2e-customer-auth:
