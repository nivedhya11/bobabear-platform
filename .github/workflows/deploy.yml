#   actions/checkout@v4.2.2             -> 11bd71901bbe5b1630ceea73d27597364c9af683
#   actions/setup-node@v4.4.0           -> 49933ea5288caeca8642d1e84afbd3f7d6820020
#   actions/upload-artifact@v4.6.2      -> ea165f8d65b6e75b540449e92b4886f43607fa02
#   aquasecurity/trivy-action@v0.30.0   -> 6c175e9c4083a92bbca2f9724c8a5e33bc2d97a5
#   github/codeql-action@v3.28.19       -> fca7ace96b7d713c7035871441bd52efbe39e27e
#   peaceiris/actions-gh-pages@v4.0.0   -> 4f9cc6602d3f66b9c108549d475ec49e8ef4d45e
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

# Allow the job to push to gh-pages branch
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: 'https://thebobabear.in'
          NEXT_PUBLIC_GA_MEASUREMENT_ID: 'G-CFR3M3J59V'

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e  # v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          cname: thebobabear.in
