#   actions/checkout@v7.0.1             -> 3d3c42e5aac5ba805825da76410c181273ba90b1
#   actions/setup-node@v7.0.0           -> 820762786026740c76f36085b0efc47a31fe5020
#   actions/upload-artifact@v7.0.1      -> 043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
#   aquasecurity/trivy-action@v0.30.0   -> 6c175e9c4083a92bbca2f9724c8a5e33bc2d97a5
#   github/codeql-action@v3.28.19       -> fca7ace96b7d713c7035871441bd52efbe39e27e
#   peaceiris/actions-gh-pages@v4.1.0   -> 84c30a85c19949d7eee79c4ff27748b70285e453
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

# Allow the job to push to gh-pages branch
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: 'https://thebobabear.in'
          NEXT_PUBLIC_GA_MEASUREMENT_ID: 'G-CFR3M3J59V'

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453  # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          cname: thebobabear.in
