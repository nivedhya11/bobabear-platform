# Dependabot — IMP-038 §15 dependency update automation (free GitHub feature).
# Does not authorize automatic merges; PRs still require CI + review policy.
# Grouping reduces weekly PR backlog while keeping majors / auth independently reviewable.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - security-sdlc
    groups:
      # Semantically coupled Tailwind toolchain — always upgrade together.
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "tailwind-merge"
        update-types:
          - "minor"
          - "patch"
      # Keep Playwright test runner and browser package aligned.
      playwright:
        patterns:
          - "@playwright/test"
          - "playwright"
          - "playwright-core"
        update-types:
          - "minor"
          - "patch"
      # Routine compatible npm patch/minor maintenance (excludes majors + sensitive pkgs).
      npm-patch-minor:
        patterns:
          - "*"
        exclude-patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "tailwind-merge"
          - "@playwright/test"
          - "playwright"
          - "playwright-core"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "eslint"
          - "@types/node"
          - "next"
          - "typescript"
          - "jsdom"
          - "framer-motion"
          - "vitest"
          - "@vitest/*"
          # Auth stack — AMBER; require deliberate review (better-auth 1.7 broke types).
          - "better-auth"
          - "@better-auth/*"
          - "auth"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Keep @types/node aligned with supported CI/runtime Node 22.x line.
      - dependency-name: "@types/node"
        versions: [">=23"]
      # Majors require deliberate ecosystem validation windows.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jsdom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "framer-motion"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@playwright/test"
        update-types: ["version-update:semver-major"]
      - dependency-name: "playwright"
        update-types: ["version-update:semver-major"]
      # Auth majors/minors remain independently visible (not grouped above).
      - dependency-name: "better-auth"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@better-auth/*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
      - security-sdlc
    groups:
      github-actions-patch-minor:
        patterns:
          - "*"
        exclude-patterns:
          - "github/codeql-action*"
        update-types:
          - "minor"
          - "patch"
      # Keep CodeQL init + analyze on the same action SHA/version.
      codeql-action:
        patterns:
          - "github/codeql-action*"
    # Action majors remain independently reviewable except CodeQL paired group.
