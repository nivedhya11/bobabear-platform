services:
  postgres:
    image: docker.io/library/postgres:18.4-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
    ports: ["127.0.0.1:${POSTGRES_HOST_PORT}:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
  workforce-auth:
    build: { context: ., dockerfile: Dockerfile, target: workforce-auth-runtime }
    expose: ["8082"]
    environment:
      BOBA_BEAR_ENV: test
      BOBA_BEAR_PUBLIC_ORIGIN: ${BOBA_BEAR_PUBLIC_ORIGIN}
      BOBA_BEAR_DATABASE_URL: ${BOBA_BEAR_DATABASE_URL}
      BOBA_BEAR_DATABASE_SSL_MODE: disable
      BOBA_BEAR_ALLOW_UNSAFE_ADAPTERS: "true"
      WORKFORCE_AUTH_SECRET: ${WORKFORCE_AUTH_SECRET}
      WORKFORCE_AUTH_BASE_URL: ${WORKFORCE_AUTH_BASE_URL}
      WORKFORCE_AUTH_PII_HASH_SECRET: ${WORKFORCE_AUTH_PII_HASH_SECRET}
      WORKFORCE_AUTH_TRUST_PROXY_HOPS: "1"
      WORKFORCE_AUTH_SERVICE_HOST: 0.0.0.0
      WORKFORCE_AUTH_SERVICE_PORT: "8082"
    depends_on: { postgres: { condition: service_healthy } }
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8082/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
  operations:
    build: { context: ., dockerfile: Dockerfile, target: operations-runtime }
    expose: ["8084"]
    environment:
      BOBA_BEAR_ENV: test
      BOBA_BEAR_PUBLIC_ORIGIN: ${BOBA_BEAR_PUBLIC_ORIGIN}
      BOBA_BEAR_DATABASE_URL: ${BOBA_BEAR_DATABASE_URL}
      BOBA_BEAR_DATABASE_SSL_MODE: disable
      BOBA_BEAR_ALLOW_UNSAFE_ADAPTERS: "true"
      WORKFORCE_AUTH_SECRET: ${WORKFORCE_AUTH_SECRET}
      WORKFORCE_AUTH_BASE_URL: ${WORKFORCE_AUTH_BASE_URL}
      WORKFORCE_AUTH_PII_HASH_SECRET: ${WORKFORCE_AUTH_PII_HASH_SECRET}
      OPERATIONS_SERVICE_HOST: 0.0.0.0
      OPERATIONS_SERVICE_PORT: "8084"
    depends_on: { postgres: { condition: service_healthy } }
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8084/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: web-runtime
      args:
        NEXT_PUBLIC_SITE_URL: "${BOBA_BEAR_PUBLIC_ORIGIN}"
    ports: ["127.0.0.1:${BOBA_BEAR_APP_HOST_PORT}:8080"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    depends_on:
      workforce-auth: { condition: service_healthy }
      operations: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
volumes:
  postgres-data:
