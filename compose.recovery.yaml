# IMP-037 recovery overlay — oneshot backup tool services (tools profile).
#
# Usage:
#   docker compose -f compose.yaml -f compose.recovery.yaml run --rm recovery-layer1-backup
#   docker compose -f compose.yaml -f compose.recovery.yaml run --rm recovery-layer2-backup
#
# These services do NOT start with ordinary `docker compose up`. They require the
# `tools` profile (or explicit `run`). They are not a substitute for production
# Spaces credentials, RPO/RTO proof, or Founder UAT.
#
# Prefer host systemd timers (docker/recovery/systemd/) for scheduled ops; those
# timers are templates only and are NOT installed by this packet.

services:
  recovery-layer1-backup:
    build:
      context: .
      dockerfile: Dockerfile
      target: tooling
      args:
        BOBA_BUILD_SHA: "${BOBA_BUILD_SHA:-unversioned-local}"
    image: boba-bear-tooling:local
    profiles: ["tools"]
    working_dir: /app
    volumes:
      - .:/app:ro
      - ${BOBA_RECOVERY_EVIDENCE_DIR:-./.recovery-evidence}:/recovery-evidence
    environment:
      BOBA_RECOVERY_EVIDENCE_DIR: /recovery-evidence
      BOBA_PGBACKREST_GENERATION: "${BOBA_PGBACKREST_GENERATION:-1}"
      BOBA_PGBACKREST_STANZA: "${BOBA_PGBACKREST_STANZA:-boba}"
    # Type=oneshot equivalent: compose `run --rm` exits after the command.
    # Override type at run-time: docker compose run -e BOBA_RECOVERY_LAYER1_TYPE=diff ...
    command:
      [
        "sh",
        "-c",
        "npm run recovery -- backup layer1 --type \"$${BOBA_RECOVERY_LAYER1_TYPE:-full}\"",
      ]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  recovery-layer2-backup:
    build:
      context: .
      dockerfile: Dockerfile
      target: tooling
      args:
        BOBA_BUILD_SHA: "${BOBA_BUILD_SHA:-unversioned-local}"
    image: boba-bear-tooling:local
    profiles: ["tools"]
    working_dir: /app
    volumes:
      - .:/app:ro
      - ${BOBA_RECOVERY_EVIDENCE_DIR:-./.recovery-evidence}:/recovery-evidence
      - ${BOBA_RECOVERY_LOCAL_STORE:-./.recovery-local-store}:/recovery-local-store
    environment:
      BOBA_RECOVERY_EVIDENCE_DIR: /recovery-evidence
      BOBA_RECOVERY_LOCAL_STORE: /recovery-local-store
      BOBA_RECOVERY_AGE_RECIPIENT: "${BOBA_RECOVERY_AGE_RECIPIENT:-}"
    command:
      [
        "npm",
        "run",
        "recovery",
        "--",
        "backup",
        "layer2",
        "--local-store",
        "/recovery-local-store",
      ]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
