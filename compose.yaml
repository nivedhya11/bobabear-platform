    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  # One-shot IMP-028C Hong Kong Milk Tea modifier bootstrap (Slice 4).
  # Default dry-run; pass --apply via `docker compose run ... -- --apply`.
  catalog-bootstrap-imp028c-modifiers:
    build:
      context: .
      dockerfile: Dockerfile
      target: tooling
      args:
        BOBA_BUILD_SHA: "${BOBA_BUILD_SHA:-unversioned-local}"
