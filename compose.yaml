    restart: "no"

  # One-shot existing-menu Brand assortment bootstrap (IMP-014). Application-role DML only.
  # Default dry-run; pass --apply via `docker compose run ... -- --apply`.
  assortment-bootstrap-existing-menu:
    build:
      context: .
