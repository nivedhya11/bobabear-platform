    image: boba-bear-tooling:local
    profiles: ["tools"]
    env_file:
      - .env.runtime.docker.local
    command: ["npm", "run", "assortment:bootstrap-existing-menu"]
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  assortment-verify-existing-menu:
