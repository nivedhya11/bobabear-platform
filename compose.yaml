    command: ["npm", "run", "pricing:bootstrap-existing-menu"]
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  pricing-verify-existing-menu:
    build:
